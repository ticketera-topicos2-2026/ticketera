# Ticketera platform: the whole system, started with a single "docker compose up" from the repository root (RB-09).
#
# Configuration comes from .env, a copy of .env.example (cp .env.example .env). Every required variable is written
# as ${VAR:?message}: when it is missing or empty, Compose stops before creating any container and names it
# (DS-16). .env is not declared as an env_file.
#
# Networks (DS-23): "edge" joins the frontend and the gateway; "backend" joins the gateway, the identity service,
# the backend services and the database. Only the gateway joins both, and only the gateway and the frontend publish
# ports, on 127.0.0.1 (DS-10).
#
# Every image is written as name:tag@sha256:<index digest>; the digest pins it and the tag documents it (DS-25).
#
# Change project-bootstrap, task group 2 (design: platform/local-environment).

# Default healthcheck timing, merged into each service's healthcheck with "<<: *healthcheck-defaults": a container
# becomes unhealthy at most 3 × (10 s + 5 s) = 45 s after it stops responding, inside the 60 s of Req
# local-environment: Every container reports its health.
x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 3

services:
  database:
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (copy .env.example to .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example to .env)}
      # Passwords of the service roles, read by the init script in infra/database/ (DS-02).
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env (copy .env.example to .env)}
      SALES_DB_PASSWORD: ${SALES_DB_PASSWORD:?set SALES_DB_PASSWORD in .env (copy .env.example to .env)}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:?set PAYMENTS_DB_PASSWORD in .env (copy .env.example to .env)}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env (copy .env.example to .env)}
    volumes:
      - ticketera-db-data:/var/lib/postgresql
      # Init scripts, run by the entrypoint only when the data volume is empty (DS-03).
      - ./infra/database:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The entrypoint starts as root, prepares the data directory and switches to the postgres user, which keeps no
    # capability. This is the minimal set, found by adding one capability at a time to cap_drop ALL and checking a
    # first start (which runs the init scripts) and a restart with existing data (DS-13):
    # - CHOWN: gives the data directory to the postgres user.
    # - DAC_READ_SEARCH: lets root list the existing data directory (mode 0700, owned by postgres) on a restart.
    # - SETGID and SETUID: switch to the postgres user (gosu).
    # Without FOWNER, root's chmod of the data and socket directories fails and is logged as "Operation not
    # permitted"; the entrypoint ignores it and repeats the chmod as the postgres user, which owns both directories.
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETGID
      - SETUID
    healthcheck:
      <<: *healthcheck-defaults
      # Over TCP, so the database is healthy only after the init scripts finish: the temporary server that runs them
      # listens only on the Unix socket. -U and -d avoid a "role does not exist" log line on every check.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
      # The init scripts of a first start (empty volume) took 35 s on a WSL VM with about 3 GiB; without a start
      # period the database became unhealthy before they finished and "up --wait" failed (#24).
      start_period: 60s

  identity:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    # Development mode: no TLS and no strict host name (DS-04). --import-realm imports the realm definition only
    # when the realm does not exist, so a restart keeps the current realm.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      # Public URL of the gateway: it fixes the issuer and every URL the identity service publishes.
      KC_HOSTNAME: http://localhost:${GATEWAY_PORT:?set GATEWAY_PORT in .env (copy .env.example to .env)}/auth
      # Enables the management interface on port 9000, which serves /auth/health and is never routed by the gateway.
      KC_HEALTH_ENABLED: "true"
      # Its own database and role, created by infra/database/ (DS-02).
      KC_DB: postgres
      KC_DB_URL_HOST: database
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env (copy .env.example to .env)}
      # Bootstrap administrator, created only on the first start, when the master realm does not exist yet.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME in .env (copy .env.example to .env)}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env (copy .env.example to .env)}
      # The identity service takes the client address from X-Forwarded-For: only the gateway reaches it, and the
      # gateway always replaces that header (IA-09, DS-08).
      KC_PROXY_HEADERS: xforwarded
      # Values of the ${...} placeholders of the realm definition, substituted when the realm is imported: the
      # frontend client accepts only addresses under FRONTEND_ORIGIN, and each test user gets its password. The
      # realm is imported only when it does not exist, so a change needs "docker compose down -v" (IA-10, IA-11).
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN in .env (copy .env.example to .env)}
      TEST_USER_ADMIN_PASSWORD: ${TEST_USER_ADMIN_PASSWORD:?set TEST_USER_ADMIN_PASSWORD in .env (copy .env.example to .env)}
      TEST_USER_EVENT_OWNER_PASSWORD: ${TEST_USER_EVENT_OWNER_PASSWORD:?set TEST_USER_EVENT_OWNER_PASSWORD in .env (copy .env.example to .env)}
      TEST_USER_CLIENT_PASSWORD: ${TEST_USER_CLIENT_PASSWORD:?set TEST_USER_CLIENT_PASSWORD in .env (copy .env.example to .env)}
      # The second EVENT_OWNER test user, for the checks of ownership in the API tests (IA-11).
      TEST_USER_OTHER_EVENT_OWNER_PASSWORD: ${TEST_USER_OTHER_EVENT_OWNER_PASSWORD:?set TEST_USER_OTHER_EVENT_OWNER_PASSWORD in .env (copy .env.example to .env)}
    volumes:
      # Realm definition with the platform roles (task 2.9; Req identity-provisioning).
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    networks:
      - backend
    depends_on:
      database:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 120s
      # The image has no curl: bash opens a TCP connection to the HTTP port and requests the realm discovery
      # document, which answers 200 only while the realm exists (DS-06). Readiness on the management port is not
      # enough: it reports UP once the import finished, even when there was nothing to import (task 2.10).
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf '%s\r\n' 'GET /auth/realms/ticketera/.well-known/openid-configuration HTTP/1.1'
          'Host: localhost' 'Connection: close' '' >&3 &&
          read -r status_line <&3 &&
          [[ $$status_line == *' 200 '* ]]

  # Catalog service (change project-bootstrap, task 3.5).
  catalog:
    build:
      context: ./services/catalog
      # Host user IDs, so files created in the mounted folder belong to the host user (DS-13). Optional: the default
      # 1000 is the first user of a WSL distribution.
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    # Applies the schema migrations, then runs the same server as the image's CMD with reload on source changes
    # (e1-event-catalog, D-33; DS-17).
    command:
      # bin/run starts Uvicorn with --no-access-log: the request log middleware writes the only line per
      # request (e1-request-log, RL-10).
      - bin/run
    labels:
      # Health path checked by the smoke test through the gateway at /api/catalog/health (DS-19).
      ticketera.health-path: /health
      # Commands run by the quality job with "docker compose run --rm catalog <command>" (DS-18): split on
      # whitespace, with no shell. bin/lint also checks the hexagonal layers with import-linter (D-33).
      ticketera.lint: bin/lint
      ticketera.typecheck: mypy
      # --cov measures domain and application and fails below 80 % (D-18; [tool.coverage] in pyproject.toml).
      ticketera.test: pytest --cov
    environment:
      # Its own database and role, created by infra/database/ (DS-02).
      DATABASE_URL: postgresql+psycopg://catalog:${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env (copy .env.example to .env)}@database:5432/catalog
    volumes:
      # Source code for live reload; the virtual environment stays in /opt/venv, outside the mount (DS-14).
      - ./services/catalog:/app
    networks:
      - backend
    depends_on:
      database:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      <<: *healthcheck-defaults
      # bin/run applies the migrations before Uvicorn starts; on a loaded machine that took longer than the 45 s
      # the default timing tolerates (e1-event-catalog).
      start_period: 60s
      # The image has no curl: Python's urllib requests /health, and a 503 or a refused connection raises, so the
      # check fails (DS-12).
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)

  # Sales service (change project-bootstrap, task 5.5).
  sales:
    build:
      context: ./services/sales
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    command:
      - bin/run
    labels:
      ticketera.health-path: /health
      ticketera.lint: bin/lint
      ticketera.typecheck: mypy
      # --cov measures domain and application and fails below 80 % (D-18; [tool.coverage] in pyproject.toml).
      ticketera.test: pytest --cov
    environment:
      DATABASE_URL: postgresql+psycopg://sales:${SALES_DB_PASSWORD:?set SALES_DB_PASSWORD in .env (copy .env.example to .env)}@database:5432/sales
    volumes:
      - ./services/sales:/app
    networks:
      - backend
    depends_on:
      database:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)

  # Payments service (change project-bootstrap, task 6.5).
  payments:
    build:
      context: ./services/payments
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    command:
      - uvicorn
      - payments.api.main:app
      - --app-dir
      - src
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --reload
      - --reload-dir
      - src
    labels:
      ticketera.health-path: /health
      ticketera.lint: ruff check .
      ticketera.typecheck: mypy
      ticketera.test: pytest
    environment:
      DATABASE_URL: postgresql+psycopg://payments:${PAYMENTS_DB_PASSWORD:?set PAYMENTS_DB_PASSWORD in .env (copy .env.example to .env)}@database:5432/payments
    volumes:
      - ./services/payments:/app
    networks:
      - backend
    depends_on:
      database:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)

  # Frontend with the status page (change project-bootstrap, task 4.5).
  frontend:
    build:
      context: ./frontend
      # Host user IDs, as for catalog (DS-13).
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    ports:
      # Published only on the local machine (DS-10); the browser opens it and calls the API through the gateway.
      - "127.0.0.1:${FRONTEND_PORT:?set FRONTEND_PORT in .env (copy .env.example to .env)}:5173"
    labels:
      # The smoke test checks the frontend on its own published port, not through the gateway (DS-19).
      ticketera.health-path: /
      # Commands run by the quality job with "docker compose run --rm frontend <command>" (DS-18).
      ticketera.lint: npx eslint .
      ticketera.typecheck: npx tsc --noEmit
      ticketera.test: npx vitest run
    environment:
      # Public address of the gateway, which the browser calls (DS-09, DS-15).
      VITE_API_BASE_URL: http://localhost:${GATEWAY_PORT:?set GATEWAY_PORT in .env (copy .env.example to .env)}
      # Sign-in through the identity service (IA-13): the ticketera realm, reached through the gateway, and the
      # frontend client of the realm definition.
      VITE_OIDC_AUTHORITY: http://localhost:${GATEWAY_PORT:?set GATEWAY_PORT in .env (copy .env.example to .env)}/auth/realms/ticketera
      VITE_OIDC_CLIENT_ID: ticketera-frontend
      # Polling fallback when file events do not reach the container (DS-17).
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    volumes:
      # Source code for live reload (DS-17); node_modules stays in an anonymous volume with the image's
      # dependencies, refreshed with "docker compose up --build -V" (DS-14).
      - ./frontend:/app
      - /app/node_modules
    # Only the edge network: the browser reaches the API through the gateway's published port (DS-23).
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 30s
      # BusyBox wget of the Alpine image (DS-12).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]

  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    ports:
      # Published only on the local machine (DS-10); the image runs NGINX as a non-root user on port 8080.
      - "127.0.0.1:${GATEWAY_PORT:?set GATEWAY_PORT in .env (copy .env.example to .env)}:8080"
    environment:
      # The only origin allowed to call the API from a browser (DS-09), substituted into the template.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN in .env (copy .env.example to .env)}
    volumes:
      # Server configuration, rendered by the image's entrypoint into /etc/nginx/conf.d/default.conf.
      - ./infra/gateway/templates:/etc/nginx/templates:ro
      # One route file per service (DS-07); test-only routes are mounted in a sibling folder (task 2.12).
      - ./infra/gateway/routes:/etc/nginx/routes/platform:ro
      # Snippets shared by the routes, such as the forwarding headers (DS-08).
      - ./infra/gateway/snippets:/etc/nginx/snippets:ro
    networks:
      - edge
      - backend
    # NGINX resolves every upstream when it starts, so the gateway starts only after the services it routes to are
    # healthy; each service pull request adds its own entry (DS-07).
    depends_on:
      identity:
        condition: service_healthy
      catalog:
        condition: service_healthy
      sales:
        condition: service_healthy
      payments:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]

  # Log collection (change e1-request-log, design RL-11 to RL-17; spec log-collection). Alloy reads the standard
  # output of every container of the project and sends it to Loki; Grafana queries Loki. No application container
  # depends on these three, so stopping them changes no response of the system, and each one has a memory limit
  # (768 MiB in total) for machines with little memory for WSL (#24).

  # Loki: log storage (RL-14). Built from infra/observability/loki/ only to add a healthcheck tool to the distroless
  # official image (RL-17).
  loki:
    build:
      context: ./infra/observability/loki
    command: ["-config.file=/etc/loki/config.yaml"]
    labels:
      # Commands run by the quality job (DS-18). Loki has no code of the project, only its configuration, so each
      # step validates the configuration file; they run with the image's entrypoint, the loki binary.
      ticketera.lint: -verify-config -config.file=/etc/loki/config.yaml
      ticketera.typecheck: -verify-config -config.file=/etc/loki/config.yaml
      ticketera.test: -verify-config -config.file=/etc/loki/config.yaml
    volumes:
      - ./infra/observability/loki/config.yaml:/etc/loki/config.yaml:ro
      # Log data; removed only with "docker compose down -v".
      - ticketera-loki-data:/loki
    networks:
      - observability
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      <<: *healthcheck-defaults
      # Loki answers /ready only once its ring and ingester are up, some seconds after a cold start.
      start_period: 60s
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]

  # Alloy: log collector (RL-12, RL-13). It reads the logs through the Docker socket, mounted read-only, and runs as
  # root, which the socket needs: the only exception to DS-13 and to the non-root rule, recorded in the ADR of D-23.
  # It keeps no capability, publishes no port and joins only the observability network.
  alloy:
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    user: "0:0"
    command:
      - run
      - /etc/alloy/config.alloy
      # Not the image's /var/lib/alloy/data: it belongs to the image's alloy user (mode 770), which root without
      # capabilities cannot enter. Docker creates this mount point owned by root.
      - --storage.path=/alloy-data
      # Its HTTP server (readiness for the healthcheck) listens only inside the container.
      - --server.http.listen-addr=127.0.0.1:12345
      - --disable-reporting
    environment:
      # Only the containers of this Compose project are collected (spec: Containers of another Compose project).
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-ticketera}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read positions, so a restart does not send the same lines again.
      - ticketera-alloy-data:/alloy-data
    networks:
      - observability
    depends_on:
      loki:
        condition: service_healthy
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      <<: *healthcheck-defaults
      # The image has no HTTP client: bash requests the readiness endpoint over a TCP connection, as for Keycloak
      # (DS-12).
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/12345 &&
          printf '%s\r\n' 'GET /-/ready HTTP/1.1' 'Host: localhost' 'Connection: close' '' >&3 &&
          read -r status_line <&3 &&
          [[ $$status_line == *' 200 '* ]]

  # Grafana: queries the request log (RL-15). Published only on the local machine, with the administrator
  # credentials from .env; anonymous access and sign-up are off, and its data source and dashboard come from files.
  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    ports:
      - "127.0.0.1:${GRAFANA_PORT:?set GRAFANA_PORT in .env (copy .env.example to .env)}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env (copy .env.example to .env)}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (copy .env.example to .env)}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # No data leaves the local machine.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # No plugin downloads on start: slower starts and traffic outside the local machine, and the Loki data source
      # is built in.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - observability
    depends_on:
      loki:
        condition: service_healthy
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      <<: *healthcheck-defaults
      # Its first start runs the database migrations of its internal store, which takes up to two minutes.
      start_period: 120s
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]

networks:
  edge:
  backend:
  # Alloy, Loki and Grafana only; no service talks to Loki (RL-16).
  observability:

volumes:
  # PostgreSQL data, mounted at /var/lib/postgresql (DS-24); removed only with "docker compose down -v".
  ticketera-db-data:
  # Loki data and Alloy read positions (e1-request-log, RL-14); removed only with "docker compose down -v".
  ticketera-loki-data:
  ticketera-alloy-data:
