# Route to the catalog service (task 3.7; DS-07; Req api-gateway: Each backend service has one route).
# The trailing slash of proxy_pass strips the public prefix /api/catalog/, which has no version (ADR-0006), so
# /api/catalog/health reaches the service as /health. No add_header here: a location that declares one stops
# inheriting the CORS headers of the server (DS-09).
location /api/catalog/ {
    include snippets/forwarded-headers.conf;
    proxy_pass http://catalog:8000/;

    # Req api-gateway: An unavailable service does not affect other routes - Scenario: Catalog service stopped.
    # NGINX resolves catalog once, at startup (DS-07). A stopped container leaves nothing at that address, so the
    # connection is never refused: it waits for the connect timeout (60 s by default) and NGINX answers 504. A short
    # timeout and the 504 turned into 502 give the answer the spec requires, well within the 5-second limit of the
    # status page (DS-15).
    proxy_connect_timeout 3s;
    error_page 504 =502 @catalog_unavailable;
}

location @catalog_unavailable {
    return 502;
}
