# Route to the catalog service (task 3.7; DS-07; Req api-gateway: Each backend service has one route).
# The trailing slash of proxy_pass strips the public prefix /api/catalog/, which has no version (ADR-0006), so
# /api/catalog/health reaches the service as /health. No add_header or error_page here: a location that declares
# one stops inheriting those of the server, the CORS headers (DS-09) and the failure mapping (IA-06).
location /api/catalog/ {
    include snippets/forwarded-headers.conf;
    proxy_pass http://catalog:8000/;
    # Req api-gateway: An unavailable service does not affect other routes - Scenario: Catalog service stopped. The
    # connect timeout and the 502 come from the server (default.conf.template, IA-06).
}
