# Route to the identity service (task 2.13; DS-07; Req api-gateway: The identity service is served under /auth).
# The identity service serves under /auth itself (KC_HTTP_RELATIVE_PATH), so the path is forwarded unchanged.
# Public: the sign-in, the token endpoint and the discovery document need no access token (IA-03; Req api-gateway:
# Public paths skip the access check). NGINX chooses this location on the normalized URI, so a raw
# /auth/../api/sales/example lands in the sales route and is checked.
location /auth/ {
    auth_request off;
    include snippets/forwarded-headers.conf;
    proxy_pass http://identity:8080;
}

# Req api-gateway: Identity service health and metrics are never exposed. They live on the management port, which
# the gateway never routes; these blocks are defense in depth in case the deprecated
# legacy-observability-interface option exposes them on the main port. A prefix also covers /auth/health/ready.
location /auth/health {
    return 404;
}

location /auth/metrics {
    return 404;
}
