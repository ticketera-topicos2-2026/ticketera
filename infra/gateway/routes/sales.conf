# Route to the sales service (tasks 5.5, 5.6; DS-07, ADR-0006; Req api-gateway: Each backend service has one route).
# The trailing slash of proxy_pass strips the public prefix /api/sales/, which has no version (ADR-0006), so
# /api/sales/health reaches the service as /health. No add_header or error_page here: a location that declares
# one stops inheriting those of the server, the CORS headers (DS-09) and the failure mapping (IA-06).
location /api/sales/ {
    include snippets/forwarded-headers.conf;
    proxy_pass http://sales:8000/;
    # Req api-gateway: An unavailable service does not affect other routes - Scenario: Sales service stopped. The
    # connect timeout and the 502 come from the server (default.conf.template, IA-06).
}
