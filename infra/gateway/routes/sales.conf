# Route to the sales service (tasks 5.5, 5.6; DS-07, ADR-0006; Req api-gateway: Each backend service has one route).
# The gateway strips the /api/sales/ prefix and forwards the trailing path to the sales service.
location /api/sales/ {
    include snippets/forwarded-headers.conf;
    proxy_pass http://sales:8000/;
}

