# Forwarding headers, included by every proxied route (task 2.13; DS-08; Req api-gateway: The gateway forwards the
# original client information). Each header is replaced with the real value of the connection, never appended to
# the value the client sent, so a forged value never reaches a service.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;

# Correlation id of the request, generated by the gateway (change e1-request-log, RL-01, RL-02; Req
# request-correlation: The gateway forwards the correlation id to the service; The correlation id is never taken
# from the client). proxy_set_header replaces any X-Correlation-ID the client sent.
proxy_set_header X-Correlation-ID $request_id;
