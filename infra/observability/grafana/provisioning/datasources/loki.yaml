# Loki data source of Grafana (change e1-request-log, design RL-15; Req log-collection: Grafana opens with the
# request log ready to use). Grafana reaches Loki by its name on the observability network (RL-16).
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
