[project]
name = "catalog"
version = "0.1.0"
description = "Catalog service of Ticketera"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.121.1",
    "uvicorn==0.38.0",
    "sqlalchemy==2.0.44",
    "psycopg[binary]==3.2.12",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
    "ruff==0.14.4",
    "mypy==1.18.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 110
src = ["src", "tests"]
# Caches stay out of the mounted folder (design, platform/local-environment).
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "S", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; test URLs carry throwaway credentials.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["catalog", "tests"]
strict = true
cache_dir = "/tmp/mypy-cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Tests must not write into the mounted folder (design, platform/local-environment).
addopts = "-p no:cacheprovider"
