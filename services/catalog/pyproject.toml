[project]
name = "catalog"
version = "0.1.0"
description = "Catalog service of Ticketera"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.121.1",
    "uvicorn==0.38.0",
    "sqlalchemy==2.0.44",
    "psycopg[binary]==3.2.12",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
]

[tool.uv]
package = false


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Tests must not write into the mounted folder (design, platform/local-environment).
addopts = "-p no:cacheprovider"
