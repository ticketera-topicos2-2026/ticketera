openapi: 3.1.0
info:
  title: Sales Service
  version: 0.1.0
  description: Sales bounded context managing ticket inventory and idempotent ticket purchases (GoPass Platform).
paths:
  /health:
    get:
      summary: Health check probe
      operationId: health
      responses:
        '200':
          description: Service is healthy and database is connected.
        '503':
          description: Database unreachable.
    head:
      summary: Health check head probe
      operationId: health_head
      responses:
        '200':
          description: Service is healthy.
        '503':
          description: Database unreachable.
  /events/{event_id}/inventory:
    post:
      summary: Initialize seat inventory for an event
      description: Administrative capability to load seats and prices for an event. Requires ADMIN role.
      operationId: initialize_inventory
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryInitRequest'
      responses:
        '201':
          description: Inventory initialized successfully.
        '401':
          description: Missing or invalid token.
        '403':
          description: Requires ADMIN role.
        '409':
          description: Inventory already initialized for this event.
        '422':
          description: Empty seat list or negative prices.
  /events/{event_id}/seats:
    get:
      summary: Query available seats for an event
      description: Retrieves available seats for a given event. Requires CLIENT or ADMIN role.
      operationId: get_available_seats
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [AVAILABLE, SOLD]
            default: AVAILABLE
      responses:
        '200':
          description: List of seats.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatResponse'
        '401':
          description: Unauthenticated.
  /events/{event_id}/orders:
    post:
      summary: Idempotent ticket purchase
      description: Atomically purchases seats and issues confirmed tickets. Requires CLIENT role and Idempotency-Key.
      operationId: purchase_tickets
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '201':
          description: Order confirmed and tickets issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Missing or invalid Idempotency-Key format.
        '401':
          description: Missing or invalid token.
        '403':
          description: Requires CLIENT role.
        '409':
          description: One or more requested seats are not available.
        '422':
          description: Idempotency key payload mismatch, empty seats, or duplicate seat IDs.
  /orders/{order_id}:
    get:
      summary: Get order details
      description: Retrieves order details and tickets. Restricted to the owning customer (BOLA) or ADMIN.
      operationId: get_order
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Missing or invalid token.
        '404':
          description: Order not found or owned by another customer.
components:
  schemas:
    SeatItem:
      type: object
      required: [seat_id, category, price_centavos]
      properties:
        seat_id:
          type: string
        category:
          type: string
        price_centavos:
          type: integer
          minimum: 0
    InventoryInitRequest:
      type: object
      required: [seats]
      properties:
        seats:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SeatItem'
    SeatResponse:
      type: object
      required: [seat_id, category, price_centavos, status]
      properties:
        seat_id:
          type: string
        category:
          type: string
        price_centavos:
          type: integer
        status:
          type: string
          enum: [AVAILABLE, SOLD]
    PurchaseRequest:
      type: object
      required: [seat_ids]
      properties:
        seat_ids:
          type: array
          minItems: 1
          items:
            type: string
    TicketResponse:
      type: object
      required: [ticket_id, seat_id, code]
      properties:
        ticket_id:
          type: string
        seat_id:
          type: string
        code:
          type: string
    OrderResponse:
      type: object
      required: [order_id, event_id, customer_id, total_amount_centavos, currency, status, tickets, created_at]
      properties:
        order_id:
          type: string
        event_id:
          type: string
        customer_id:
          type: string
        total_amount_centavos:
          type: integer
        currency:
          type: string
          example: ARS
        status:
          type: string
          example: CONFIRMED
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/TicketResponse'
        created_at:
          type: string
          format: date-time
