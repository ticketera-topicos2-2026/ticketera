# Test-only gateway route to the echo service of tests/smoke/compose.echo.yml (task 2.12). It includes the same
# forwarding snippet as the real routes, so the forwarding checks of the smoke test exercise the real
# configuration (Req api-gateway: The gateway forwards the original client information; DS-08).
location /smoke-test/echo/ {
    include snippets/forwarded-headers.conf;
    proxy_pass http://echo:8081/;
}
