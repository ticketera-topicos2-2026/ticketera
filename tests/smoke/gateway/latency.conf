# Test-only gateway route to the echo service of tests/smoke/compose.echo.yml (change e1-identity-access, task 1.9;
# IA-17). Like the route file of a backend service added later, it declares nothing about access, so the smoke test
# can check that the access check still applies to it (Req api-gateway: Requests forwarded on paths that are not
# public require a valid access token - Scenario: Route added later). Its health path is public, as that of any
# route, and the latency measurement of task 2.19 compares it with a protected path of the same route and backend.
location /api/smoke-latency/ {
    include snippets/forwarded-headers.conf;
    proxy_pass http://echo:8081/;
}
