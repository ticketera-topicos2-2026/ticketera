# Test-only gateway route to a closed port of the echo service of tests/smoke/compose.echo.yml (e1-request-log,
# task 1.2). The connection is refused at once, so the gateway answers 502 without stopping any real service, which
# would change its address and break its route (DS-07). Used by the correlation id and access log checks of
# tests/smoke/request-log-checks.sh (Req request-correlation: The gateway gives every request a correlation id -
# Scenario: Service stopped; Req api-gateway: The gateway writes one JSON access log line per request - Scenario:
# Request to a stopped service).
location /smoke-test/unavailable/ {
    include snippets/forwarded-headers.conf;
    proxy_pass http://echo:9/;
}
